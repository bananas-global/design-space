# Jornada e acessibilidade contra o preview publicado.
#
# O gatilho `deployment_status` entrega a URL do preview pronta em
# `target_url`, o que dispensa qualquer lógica de descobrir onde a Vercel
# publicou. E como o preview é público (D-11), o Playwright aponta direto: não há
# segredo de bypass, header de automação nem shareable link a emitir e revogar.
name: Preview tests

on: deployment_status

jobs:
  test:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Instalar navegador
        run: pnpm exec playwright install --with-deps chromium

      - name: Jornada e axe por cenário
        env:
          PREVIEW_URL: ${{ github.event.deployment_status.target_url }}
        run: pnpm test:e2e

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
