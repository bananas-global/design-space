# CI do repositório de design.
#
# Governança proporcional (Princípio 9): iteração visual acontece local, sem PR
# por mudança. Este workflow existe para o que é barato e pega erro caro —
# typecheck, contrato de cenário, regras e build.
#
# A jornada Playwright roda contra o preview, em `preview-tests.yml`, e
# não aqui: rodar contra um build local testaria um artefato que ninguém revisa.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # O `design-space-pr` reescreve a descrição do PR.
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Contrato de cenário e regras
        run: pnpm test

      - name: Build
        run: pnpm build

      # Critérios de aceite gerados do registro, na descrição do PR. Ver
      # docs/handoff.md. Quem publica preview por PR passa a origem dele em
      # `--origin`, e o bloco ganha um link por cenário. O token de PR do
      # Dependabot e de fork é só de leitura, por isso o passo pula esses PRs.
      - name: Critérios de aceite na descrição do PR
        if: >-
          github.event_name == 'pull_request' &&
          github.actor != 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: pnpm exec design-space-pr
        env:
          GH_TOKEN: ${{ github.token }}
